<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MT5 AI Autobot</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js'></script></head><body class='bg-[#08090b] text-white min-h-screen'><div class='max-w-[1500px] mx-auto p-5'><header class='flex items-center justify-between mb-5'><div><div class='text-2xl font-bold'>MT5 AI AUTOBOT</div><div class='text-xs text-zinc-500'>AI • RISK • EXECUTION • MONITORING</div></div><div class='flex gap-2'><button id='start' class='px-4 py-2 rounded bg-lime-400 text-black font-semibold'>START</button><button id='stop' class='px-4 py-2 rounded bg-red-500/20 text-red-300'>STOP</button></div></header><div id='cards' class='grid md:grid-cols-5 gap-3 mb-4'></div><div class='grid lg:grid-cols-[1fr_360px] gap-4'><section class='rounded-xl border border-zinc-800 bg-zinc-950 p-3'><div class='flex gap-2 mb-3'><select id='symbol' class='bg-zinc-900 border border-zinc-800 rounded px-3 py-2'></select><select id='tf' class='bg-zinc-900 border border-zinc-800 rounded px-3 py-2'><option>M5</option><option>M15</option><option>H1</option><option>H4</option><option>D1</option></select></div><div id='chart' style='height:520px'></div></section><aside class='space-y-4'><div class='rounded-xl border border-zinc-800 bg-zinc-950 p-4'><h2 class='font-semibold mb-3'>AI ENGINE</h2><pre id='signal' class='text-xs whitespace-pre-wrap text-zinc-300'>WAITING...</pre></div><div class='rounded-xl border border-zinc-800 bg-zinc-950 p-4'><h2 class='font-semibold mb-3'>EVENT FEED</h2><div id='feed' class='space-y-2 max-h-72 overflow-auto text-xs'></div></div></aside></div></div><script>const symbols=['EURUSDm','GBPUSDm','BTCUSDm','XAUUSDm'];const s=document.getElementById('symbol');symbols.forEach(x=>s.add(new Option(x,x)));let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#090a0c'},textColor:'#aaa'},grid:{vertLines:{color:'#18191d'},horzLines:{color:'#18191d'}},rightPriceScale:{borderColor:'#333'},timeScale:{borderColor:'#333'}});let series=chart.addCandlestickSeries();async function loadChart(){let r=await fetch(`/api/chart/${s.value}?tf=${document.getElementById('tf').value}`);let d=await r.json();series.setData(d.candles.map(x=>({time:Math.floor(new Date(x.time).getTime()/1000),open:x.open,high:x.high,low:x.low,close:x.close})));chart.timeScale().fitContent()}async function status(){let r=await fetch('/api/status');let d=await r.json();document.getElementById('cards').innerHTML=[['STATUS',d.connected?'CONNECTED':'OFFLINE'],['MODE',d.mode],['BALANCE',d.balance??'-'],['EQUITY',d.equity??'-'],['POSITIONS',d.positions]].map(x=>`<div class='rounded-xl border border-zinc-800 bg-zinc-950 p-4'><div class='text-[10px] text-zinc-500'>${x[0]}</div><div class='text-lg font-semibold mt-1'>${x[1]}</div></div>`).join('');document.getElementById('signal').textContent=JSON.stringify(d.last_signal,null,2);document.getElementById('feed').innerHTML=(d.events||[]).slice(0,20).map(e=>`<div class='border-b border-zinc-900 pb-2'><b>${e.kind}</b> <span class='text-zinc-500'>${e.symbol||''}</span><div class='text-zinc-500'>${e.logic||e.reason||e.error||''}</div></div>`).join('')}async function ctl(running){await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({running})});status()}document.getElementById('start').onclick=()=>ctl(true);document.getElementById('stop').onclick=()=>ctl(false);s.onchange=loadChart;document.getElementById('tf').onchange=loadChart;loadChart();status();setInterval(status,3000);setInterval(loadChart,5000)</script></body></html>
