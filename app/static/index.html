<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT5 AI Autobot</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script></head>
<body class="bg-[#070809] text-white min-h-screen"><div class="max-w-[1600px] mx-auto p-4 md:p-6">
<header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5"><div><div class="text-2xl font-bold tracking-tight">MT5 AI AUTOBOT</div><div class="text-xs text-zinc-500">AI • RISK • EXECUTION • LIVE ACCOUNT MONITOR</div></div>
<div class="flex items-center gap-3"><div id="connection" class="text-xs text-zinc-500">MT5: checking...</div><button id="tradeBtn" class="px-5 py-2.5 rounded-lg font-bold border border-zinc-700 bg-zinc-900">TRADING OFF</button><button id="reconnect" class="px-4 py-2.5 rounded-lg border border-zinc-700 bg-zinc-900">RECONNECT</button></div></header>
<div id="cards" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3 mb-4"></div>
<div class="grid xl:grid-cols-[minmax(0,1fr)_390px] gap-4"><section class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-3"><div class="flex flex-wrap gap-2 mb-3"><select id="symbol" class="bg-zinc-900 border border-zinc-800 rounded px-3 py-2"></select><select id="tf" class="bg-zinc-900 border border-zinc-800 rounded px-3 py-2"><option>M5</option><option>M15</option><option>H1</option><option>H4</option><option>D1</option></select></div><div id="chart" style="height:560px"></div></section>
<aside class="space-y-4"><div class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-4"><div class="flex justify-between"><h2 class="font-semibold">ACCOUNT</h2><span id="mode" class="text-xs text-zinc-500"></span></div><div id="account" class="grid grid-cols-2 gap-3 mt-3 text-xs"></div></div>
<div class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-4"><h2 class="font-semibold mb-3">AI ENGINE</h2><pre id="signal" class="text-xs whitespace-pre-wrap text-zinc-300">WAITING...</pre></div>
<div class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-4"><h2 class="font-semibold mb-3">OPEN POSITIONS</h2><div id="positions" class="space-y-2 text-xs"></div></div>
<div class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-4"><h2 class="font-semibold mb-3">EVENT FEED</h2><div id="feed" class="space-y-2 max-h-64 overflow-auto text-xs"></div></div></aside></div></div>
<script>
const symbols=['EURUSDm','GBPUSDm','BTCUSDm','XAUUSDm']; const s=document.getElementById('symbol'); symbols.forEach(x=>s.add(new Option(x,x)));
const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#0b0c0e'},textColor:'#aaa'},grid:{vertLines:{color:'#18191d'},horzLines:{color:'#18191d'}},rightPriceScale:{borderColor:'#333'},timeScale:{borderColor:'#333'}}); const series=chart.addCandlestickSeries();
async function loadChart(){try{const r=await fetch('/api/chart/'+s.value+'?tf='+document.getElementById('tf').value);const d=await r.json();series.setData(d.candles.map(x=>({time:Math.floor(new Date(x.time).getTime()/1000),open:x.open,high:x.high,low:x.low,close:x.close})));chart.timeScale().fitContent()}catch(e){}}
async function status(){try{const d=await (await fetch('/api/status')).json(); document.getElementById('connection').textContent=d.connected?'MT5: CONNECTED':'MT5: OFFLINE'; document.getElementById('tradeBtn').textContent=d.trading_enabled?'TRADING ON':'TRADING OFF'; document.getElementById('tradeBtn').className='px-5 py-2.5 rounded-lg font-bold border '+(d.trading_enabled?'border-lime-400 bg-lime-400 text-black':'border-zinc-700 bg-zinc-900 text-zinc-200');
document.getElementById('mode').textContent=(d.mode||'')+(d.live_allowed?' • LIVE CAPABLE':' • PAPER'); const a=d.account||{}; const vals=[['BALANCE',a.balance],['EQUITY',a.equity],['FLOAT P&L',a.profit],['FREE MARGIN',a.free_margin],['LOGIN',a.login],['SERVER',a.server],['CURRENCY',a.currency],['POSITIONS',d.positions]]; document.getElementById('cards').innerHTML=vals.map(x=>'<div class="rounded-xl border border-zinc-800 bg-[#0b0c0e] p-3"><div class="text-[10px] text-zinc-500">'+x[0]+'</div><div class="text-sm font-semibold mt-1">'+(x[1]??'-')+'</div></div>').join('');
document.getElementById('account').innerHTML='<div>Account<br><b>'+(a.name||'-')+'</b></div><div>Server<br><b>'+(a.server||'-')+'</b></div><div>Balance<br><b>'+(a.balance??'-')+'</b></div><div>Equity<br><b>'+(a.equity??'-')+'</b></div>';
document.getElementById('signal').textContent=JSON.stringify(d.last_signal,null,2);
document.getElementById('positions').innerHTML=(d.position_items||[]).length?(d.position_items.map(p=>'<div class="border-b border-zinc-900 pb-2"><b>'+p.symbol+'</b> • '+p.volume+' • P&L: '+p.profit+'<br><span class="text-zinc-500">Entry '+p.price_open+' | SL '+p.sl+' | TP '+p.tp+'</span></div>').join('')):'<span class="text-zinc-500">No open positions</span>';
document.getElementById('feed').innerHTML=(d.events||[]).slice(0,25).map(e=>'<div class="border-b border-zinc-900 pb-2"><b>'+e.kind+'</b> <span class="text-zinc-500">'+(e.symbol||'')+'</span><div class="text-zinc-500">'+(e.logic||e.reason||e.error||'')+'</div></div>').join('');}catch(e){document.getElementById('connection').textContent='BACKEND OFFLINE'}}
async function toggle(){const d=await (await fetch('/api/status')).json();await fetch('/api/trading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!d.trading_enabled})});status()}
document.getElementById('tradeBtn').onclick=toggle;document.getElementById('reconnect').onclick=async()=>{await fetch('/api/reconnect',{method:'POST'});status()};s.onchange=loadChart;document.getElementById('tf').onchange=loadChart;loadChart();status();setInterval(status,3000);setInterval(loadChart,5000);
</script></body></html>
